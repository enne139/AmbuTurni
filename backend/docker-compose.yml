# Avvio del backend ospedali + PostgreSQL, per sviluppo/test locale.
# Compatibile con docker compose e podman-compose. In produzione questo
# backend non gira da solo: è incorporato nell'immagine web (vedi il
# Dockerfile alla radice del repo) — qui si builda invece localmente da
# backend/Dockerfile, nessuna immagine da un registry.
#
#   cp .env.example .env   # personalizza le credenziali
#   docker compose up --build -d   # (oppure: podman-compose up --build -d)

services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ambulanza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ambulanza
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ambulanza -d ambulanza']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://ambulanza:${POSTGRES_PASSWORD:-change_me}@db:5432/ambulanza
      JWT_SECRET: ${JWT_SECRET:-change_me_secret}
      TOKEN_TTL: ${TOKEN_TTL:-30d}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_me}
    ports:
      - '3000:3000'

volumes:
  pgdata:
