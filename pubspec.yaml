name: ambu_turni
description: App per la gestione di turni e assistenze in ambulanza. Offline-first, Android, tema scuro.
publish_to: 'none'
version: 1.8.0+12

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # SQLite locale (nativo su Android, FFI su Windows/desktop, WASM su web).
  # sqflite_common_ffi bump da ^2.3.3 (2.3.5) a ^2.4.2: la 2.3.5 importa
  # `package:sqlite3/open.dart`, rimosso in sqlite3 3.x — compilava (e
  # funzionava) solo finché sqlite3 restava in 2.x. sqflite_common_ffi_web
  # 1.x invece richiede sqlite3 >=3.1.2: con entrambi i pacchetti sulla 2.x
  # (i vincoli originali di entrambi lo permettevano) l'app compilava ma
  # sqflite_common_ffi_web 0.4.x falliva a runtime nel browser
  # (`Unsupported operation: unsupported result null`, verificato in Chrome)
  # — versione troppo vecchia per la sqflite_common in uso nonostante il
  # vincolo di pubspec lo permettesse. sqlite3 pinnato esplicitamente perché
  # senza pub sceglie comunque una versione diversa a ogni pub get.
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.4.2
  sqflite_common_ffi_web: ^1.1.2
  sqlite3: ^3.1.2
  path: ^1.9.0

  # Percorsi di sistema (Documents, cache…)
  path_provider: ^2.1.3

  # State management semplice con ChangeNotifier
  provider: ^6.1.2

  # Formattazione date
  intl: ^0.19.0

  # Generazione UUID per gli id locali
  uuid: ^4.4.0

  # Condivisione file (export backup). Bump da ^9.0.0 a ^12.0.2 richiesto da
  # sqflite_common_ffi_web (dipende da package:web >=1.0.0, incompatibile con
  # web ^0.5.0 di share_plus 9.x): la versione web-only "SQLite in WASM" del
  # DB porta con sé un aggiornamento a cascata di questa dipendenza non
  # collegata, altrimenti pub non risolve.
  share_plus: ^12.0.2

  # Selezione file (import backup)
  file_picker: ^8.0.7

  # HTTP per la sincronizzazione col backend
  http: ^1.2.1

  # Preferenze persistenti (es. URL server, ultimo sync)
  shared_preferences: ^2.3.2

  # Rendering markdown nelle note (fork mantenuto: flutter_markdown ufficiale
  # è discontinued dal team Flutter)
  flutter_markdown_plus: ^1.0.7

  # Lettura XLSX (tool Piano turni: foglio Google dei turni dell'associazione)
  excel: ^4.0.6

  # Aggiunta eventi al calendario di sistema (tool Piano turni: pulsante
  # "Aggiungi al calendario" sulle card dei blocchi). Su Android apre l'editor
  # evento del calendario via intent, senza permessi runtime.
  add_2_calendar: ^3.1.1

  # Scansione barcode/QR (tool Magazzino Verde). Android/iOS/web.
  mobile_scanner: ^7.2.0

  # Versione app compilata (X.Y.Z+N) letta dalla piattaforma, per mostrarla
  # in Impostazioni senza duplicarla a mano fuori da pubspec.yaml.
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Icona app (ambulanza + orologio, sfondo verde). image_path è usato per
# Windows e come fallback; adaptive_icon_* genera l'icona adattiva Android
# (sfondo verde pieno + ambulanza senza sfondo, così il sistema può
# mascherarla in cerchio/squircle senza tagliare via lo sfondo).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#00A651"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#00A651"
    theme_color: "#00A651"
