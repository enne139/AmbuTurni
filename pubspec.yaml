name: ambu_turni
description: App per la gestione di turni e assistenze in ambulanza. Offline-first, Android, tema scuro.
publish_to: 'none'
version: 1.3.0+6

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # SQLite locale (nativo su Android, FFI su Windows/desktop)
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0

  # Percorsi di sistema (Documents, cache…)
  path_provider: ^2.1.3

  # State management semplice con ChangeNotifier
  provider: ^6.1.2

  # Formattazione date
  intl: ^0.19.0

  # Generazione UUID per gli id locali
  uuid: ^4.4.0

  # Condivisione file (export backup)
  share_plus: ^9.0.0

  # Selezione file (import backup)
  file_picker: ^8.0.7

  # HTTP per la sincronizzazione col backend
  http: ^1.2.1

  # Preferenze persistenti (es. URL server, ultimo sync)
  shared_preferences: ^2.3.2

  # Rendering markdown nelle note (fork mantenuto: flutter_markdown ufficiale
  # è discontinued dal team Flutter)
  flutter_markdown_plus: ^1.0.7

  # Lettura XLSX (tool Piano turni: foglio Google dei turni dell'associazione)
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Icona app (ambulanza + orologio, sfondo verde). image_path è usato per
# Windows e come fallback; adaptive_icon_* genera l'icona adattiva Android
# (sfondo verde pieno + ambulanza senza sfondo, così il sistema può
# mascherarla in cerchio/squircle senza tagliare via lo sfondo).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#00A651"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
