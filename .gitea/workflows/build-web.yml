# Action Gitea: costruisce e pubblica l'immagine della versione web (build
# Flutter + nginx per servire i file statici) sul Container Registry della
# STESSA istanza Gitea. Build/push sullo stesso pattern di
# build-backend.yml, ma trigger sui tag vX.Y.Z come build-android.yml: la
# web app segue lo stesso versionamento dell'APK, si ripubblica a ogni
# release (non a ogni push su main — continuous deploy scollegherebbe
# "versione app" da "cosa gira in produzione sul web").
# Il deploy sul server resta manuale, come gia' per il backend.
#
# Riusa lo stesso secret REGISTRY_TOKEN di build-backend.yml (PAT con scope
# write:package): nessun secret nuovo da configurare.
#
# Richiede un runner con accesso al daemon Docker (socket
# /var/run/docker.sock montato, oppure Docker-in-Docker).

name: build-web-image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepara variabili registry
        # Host del registry = host di questa istanza Gitea, senza schema http/https.
        # Owner in minuscolo perché i nomi immagine Docker devono essere lowercase.
        run: |
          REGISTRY="${GITHUB_SERVER_URL#http://}"
          REGISTRY="${REGISTRY#https://}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
          echo "IMAGE=$REGISTRY/$OWNER/ambuturni-web" >> "$GITHUB_ENV"

      - name: Login al registry
        # PAT via stdin: utente = chi ha lanciato il workflow (proprietario del token).
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login -u "${{ github.actor }}" --password-stdin "$REGISTRY"

      - name: Build dell'immagine
        # Builder "default" (driver docker) + --load: l'immagine entra nello
        # store locale del daemon (il builder docker-container non carica in
        # locale e gira in rete isolata che non raggiunge il registry, stessa
        # nota di build-backend.yml). Contesto la radice del repo (dove sta
        # il Dockerfile, che ha bisogno di tutto il progetto Flutter). Tag
        # sia con lo SHA e "latest" (build-backend.yml) sia col nome del tag
        # vX.Y.Z (build-android.yml): sul server si puo' puntare a una
        # versione precisa invece che solo all'ultima.
        run: |
          docker buildx build --builder default --load \
            -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" -t "$IMAGE:${{ github.ref_name }}" .

      - name: Push dell'immagine
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.ref_name }}"
