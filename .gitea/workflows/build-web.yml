# Action Gitea: costruisce e pubblica l'immagine della versione web (build
# Flutter + backend Go di backend/ + nginx, che serve i file statici e fa da
# reverse proxy verso il backend — vedi il Dockerfile alla radice) sul
# Container Registry della STESSA istanza Gitea. Trigger sui tag vX.Y.Z come
# build-android.yml: la web app segue lo stesso versionamento dell'APK, si
# ripubblica a ogni release (non a ogni push su main — continuous deploy
# scollegherebbe "versione app" da "cosa gira in produzione sul web"). Il
# deploy sul server resta manuale. Il backend non ha più una sua immagine
# separata (era build-backend.yml, rimosso): è incorporato qui.
#
# Serve UN solo secret REGISTRY_TOKEN (PAT Gitea con scope write:package).
#
# Richiede un runner con accesso al daemon Docker (socket
# /var/run/docker.sock montato, oppure Docker-in-Docker).

name: build-web-image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepara variabili registry
        # Host del registry = host di questa istanza Gitea, senza schema http/https.
        # Owner in minuscolo perché i nomi immagine Docker devono essere lowercase.
        run: |
          REGISTRY="${GITHUB_SERVER_URL#http://}"
          REGISTRY="${REGISTRY#https://}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
          echo "IMAGE=$REGISTRY/$OWNER/ambuturni-web" >> "$GITHUB_ENV"

      - name: Login al registry
        # PAT via stdin: utente = chi ha lanciato il workflow (proprietario del token).
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login -u "${{ github.actor }}" --password-stdin "$REGISTRY"

      - name: Build dell'immagine
        # Builder "default" (driver docker) + --load: l'immagine entra nello
        # store locale del daemon (il builder docker-container non carica in
        # locale e gira in rete isolata che non raggiunge il registry).
        # Contesto la radice del repo (dove sta il Dockerfile, che ha
        # bisogno di tutto il progetto Flutter + backend/). Tag sia con lo
        # SHA e "latest" sia col nome del tag vX.Y.Z (come build-android.yml):
        # sul server si puo' puntare a una versione precisa invece che solo
        # all'ultima.
        run: |
          docker buildx build --builder default --load \
            -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" -t "$IMAGE:${{ github.ref_name }}" .

      - name: Push dell'immagine
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.ref_name }}"
