# Workflow Gitea: compila l'APK Android con Flutter.
#
# Trigger: manuale (workflow_dispatch) o push di tag vX.Y.Z.
#
# Requisiti runner: label `android`, Linux x86_64, curl/unzip/wget,
# JDK 23 preinstallato o scaricabile, accesso a Internet, >= 8 GB RAM.
#
# Output: APK caricato come artifact della run.

name: build-android-apk

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.22.3'
  JAVA_VERSION: '23'
  # Android SDK 34 — target di Flutter 3.22.x
  ANDROID_SDK_ROOT: /opt/android-sdk

jobs:
  build:
    runs-on: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Installa Android SDK command-line tools
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools"           >> $GITHUB_PATH
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"             >> $GITHUB_ENV

      - name: Accetta licenze e installa pacchetti SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Installa dipendenze Dart
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release

      - name: Pubblica APK come artifact
        uses: actions/upload-artifact@v3
        with:
          name: ambulanza-turni-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
