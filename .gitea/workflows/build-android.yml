# Workflow Gitea: compila l'APK Android con Flutter.
#
# Trigger: manuale (workflow_dispatch) o push di tag vX.Y.Z.
#
# Il job gira nell'immagine ghcr.io/cirruslabs/flutter (Flutter + JDK +
# Android SDK preinstallati): su un runner effimero elimina i ~10 minuti di
# download/estrazione di Flutter e Android SDK a ogni run. L'immagine viene
# scaricata una volta per nodo e poi resta nella cache immagini del nodo,
# che sopravvive ai pod effimeri — non serve il cache backend di Gitea per
# il toolchain. Requisiti runner: label `android`, supporto ai job container
# (docker/k8s), accesso a ghcr.io, >= 8 GB RAM.
#
# La versione dell'immagine è pinnata (build riproducibili): aggiornarla a
# mano quando si aggiorna Flutter in locale. Le patch release di Flutter non
# sempre hanno un tag immagine (es. 3.44.4 locale -> 3.44.0 qui, il più
# recente disponibile): differenze di patch sono accettabili per la build.
# Se AGP richiede platform/build-tools non inclusi nell'immagine, li scarica
# da solo al primo build (licenze già accettate nell'immagine).
#
# APK compilato solo per arm64 (--target-platform android-arm64): dimezza
# il tempo di build nativo rispetto al fat APK multi-ABI, ma non installa
# su emulatori x86 o device 32-bit/molto vecchi.
#
# Le actions/cache su Gradle e pub restano utili SOLO se l'istanza Gitea ha
# un cache backend configurato; se assente fanno cache-miss silenzioso
# senza rompere la build.
#
# Output: APK caricato come artifact della run. Sui push di tag, l'APK viene
# ANCHE pubblicato come Release su Gitea (allegato al tag), con l'action
# akkuman/gitea-release-action (dedicata a Gitea, non l'action GitHub ufficiale
# che non esiste per questo scopo). Serve il secret REGISTRY_TOKEN (PAT con
# scope write:repository, oltre a write:package già richiesto per il backend).

name: build-android-apk

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: android
    # Flutter, JDK e Android SDK sono già dentro l'immagine: niente step di
    # setup. Se il runner ignorasse `container:` (label in modalità host),
    # la build fallirebbe subito con "flutter: command not found" — in quel
    # caso il container va configurato come immagine di default del runner.
    container: ghcr.io/cirruslabs/flutter:3.44.0

    steps:
      - name: Installa Node.js (richiesto dalle action JS)
        # L'immagine cirruslabs/flutter non include Node, ma act_runner esegue
        # le action JavaScript (checkout, cache, upload-artifact, release) con
        # il `node` DEL container: senza questo step il job muore subito al
        # checkout con "node: executable file not found in $PATH". Tarball
        # ufficiale (~30MB, pochi secondi), più rapido di apt-get.
        # Il checksum SHA256 (da SHASUMS256.txt di nodejs.org) blocca il job
        # se il tarball scaricato non è quello atteso (mirror compromesso o
        # download corrotto): senza verifica il binario finirebbe in PATH.
        run: |
          curl -fsSLO https://nodejs.org/dist/v20.18.1/node-v20.18.1-linux-x64.tar.gz
          echo "259e5a8bf2e15ecece65bd2a47153262eda71c0b2c9700d5e703ce4951572784  node-v20.18.1-linux-x64.tar.gz" | sha256sum -c -
          tar -xzf node-v20.18.1-linux-x64.tar.gz -C /opt
          rm node-v20.18.1-linux-x64.tar.gz
          ln -sf /opt/node-v20.18.1-linux-x64/bin/node /usr/local/bin/node

      - name: Checkout
        # Action pinnate per commit SHA (non per tag): un tag può essere
        # spostato su codice diverso, lo SHA no. Aggiornare SHA e commento
        # insieme quando si fa il bump di versione.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Cache Gradle
        # ~/.gradle/caches contiene i .jar di Gradle/AGP/Kotlin scaricati a
        # ogni build (decine di MB) che su un pod effimero altrimenti si
        # riscaricano ogni volta. Chiave sul lockfile del wrapper cosi' un
        # bump di versione Gradle invalida la cache automaticamente.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Cache pub
        # Cache dei package Dart scaricati da `flutter pub get`. Chiave su
        # pubspec.lock (ora versionato): si invalida solo quando cambiano
        # davvero le versioni risolte, non a ogni ritocco del pubspec.yaml.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}

      - name: Installa dipendenze Dart
        run: flutter pub get

      - name: Prepara keystore di release
        # Ricostruisce il keystore dai secret e genera android/key.properties
        # (gitignorato): build.gradle lo legge e firma l'APK con la chiave di
        # release. Senza questo step la build ricadrebbe sulla firma debug,
        # che cambia tra runner e rompe gli aggiornamenti via Obtainium.
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/ambuturni-release.jks
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            /tmp/ambuturni-release.jks "$KEYSTORE_PASSWORD" ambuturni "$KEYSTORE_PASSWORD" \
            > android/key.properties
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Build APK release
        # target-platform limitato ad arm64 (praticamente tutti i device
        # recenti): evita di compilare anche per armeabi-v7a/x86_64, il
        # grosso del tempo di build nativo. Tradeoff esplicito: l'APK non
        # installa su emulatori x86 o device molto vecchi/32-bit.
        run: flutter build apk --release --target-platform android-arm64

      - name: Pubblica APK come artifact
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: ambuturni-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Pubblica la Release su Gitea (solo su push di tag)
        # continue-on-error: un fallimento qui (es. token senza scope corretto) non
        # deve far fallire il job: l'APK e l'artifact sono già stati pubblicati allo
        # step precedente. In caso di errore, il log stampato dall'action stessa
        # riporta la risposta HTTP di Gitea (utile per distinguere token mancante
        # da scope sbagliato: verifica write:repository su REGISTRY_TOKEN).
        if: github.ref_type == 'tag'
        continue-on-error: true
        uses: akkuman/gitea-release-action@b8d9144f302c68610911db1aaf722708d5c02d94 # v1.3.6
        env:
          NODE_OPTIONS: '--experimental-fetch'
        with:
          server_url: ${{ github.server_url }}
          repository: ${{ github.repository }}
          token: ${{ secrets.REGISTRY_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: "Build automatica da ${{ github.sha }}."
          files: |-
            build/app/outputs/flutter-apk/app-release.apk
