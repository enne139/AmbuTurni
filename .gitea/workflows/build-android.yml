# Workflow Gitea: compila l'APK Android con Flutter.
#
# Trigger: manuale (workflow_dispatch) o push di tag vX.Y.Z.
# Non gira a ogni push perché il build Flutter richiede Flutter SDK + Gradle.
#
# Requisiti runner: label `android`, immagine Linux x86_64 con curl/unzip,
# JDK 23 preinstallato o scaricabile via setup-java, accesso a Internet.
# Consigliati >= 8 GB RAM e ~15 GB liberi.
#
# Output: APK caricato come artifact della run (scaricabile dalla pagina in Gitea).
# Su Gitea si usa upload-artifact@v3 perché la v4 usa un protocollo non supportato.

name: build-android-apk

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.22.3'
  JAVA_VERSION: '23'

jobs:
  build:
    runs-on: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Installa dipendenze Dart
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Pubblica l'APK come artifact
        uses: actions/upload-artifact@v3
        with:
          name: ambulanza-turni-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
