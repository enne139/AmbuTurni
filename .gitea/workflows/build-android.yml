# Workflow Gitea: compila l'APK Android con Flutter.
#
# Trigger: manuale (workflow_dispatch) o push di tag vX.Y.Z.
#
# Requisiti runner: label `android`, Linux x86_64, wget/unzip/curl,
# JDK 23 preinstallato o scaricabile, accesso a Internet, >= 8 GB RAM.
#
# Output: APK caricato come artifact della run.

name: build-android-apk

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 'stable'
  JAVA_VERSION: '23'

jobs:
  build:
    runs-on: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Installa Android SDK
        run: |
          SDK=$HOME/android-sdk
          TOOLS=$SDK/cmdline-tools/latest/bin
          mkdir -p $SDK/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
               -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d $SDK/cmdline-tools
          mv $SDK/cmdline-tools/cmdline-tools $SDK/cmdline-tools/latest
          yes | $TOOLS/sdkmanager --licenses > /dev/null 2>&1 || true
          $TOOLS/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK"     >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "$TOOLS"                >> $GITHUB_PATH
          echo "$SDK/platform-tools"   >> $GITHUB_PATH

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Installa dipendenze Dart
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release

      - name: Pubblica APK come artifact
        uses: actions/upload-artifact@v3
        with:
          name: ambulanza-turni-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
