# Workflow Gitea: compila l'APK Android con Flutter.
#
# Trigger: manuale (workflow_dispatch) o push di tag vX.Y.Z.
#
# Requisiti runner: label `android`, Linux x86_64, wget/unzip/curl,
# JDK 23 preinstallato o scaricabile, accesso a Internet, >= 8 GB RAM.
#
# Output: APK caricato come artifact della run. Sui push di tag, l'APK viene
# ANCHE pubblicato come Release su Gitea (allegato al tag), tramite chiamate
# dirette alla REST API di Gitea con curl — stesso pattern/secret già usato in
# build-backend.yml (niente action di terze parti: la loro compatibilità con
# questa istanza Gitea non è garantita, vedi storico del progetto).
# Serve il secret REGISTRY_TOKEN (PAT con scope write:repository, oltre a
# write:package già richiesto per il backend).

name: build-android-apk

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '23'

jobs:
  build:
    runs-on: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Installa Android SDK
        run: |
          SDK=$HOME/android-sdk
          TOOLS=$SDK/cmdline-tools/latest/bin
          mkdir -p $SDK/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
               -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d $SDK/cmdline-tools
          mv $SDK/cmdline-tools/cmdline-tools $SDK/cmdline-tools/latest
          yes | $TOOLS/sdkmanager --licenses > /dev/null 2>&1 || true
          $TOOLS/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK"     >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "$TOOLS"                >> $GITHUB_PATH
          echo "$SDK/platform-tools"   >> $GITHUB_PATH

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Installa dipendenze Dart
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release

      - name: Pubblica APK come artifact
        uses: actions/upload-artifact@v3
        with:
          name: ambulanza-turni-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Pubblica la Release su Gitea (solo su push di tag)
        # Rimuove una eventuale release omonima da run precedenti sullo stesso tag
        # (idempotente: il 404 se non esiste viene ignorato), poi ne crea una nuova
        # e allega l'APK come asset. L'id della release è estratto senza jq (non
        # garantito sul runner) con grep -oP, coerente con lo stile bash già usato
        # nel resto dei workflow di questo progetto.
        if: github.ref_type == 'tag'
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          API="${GITHUB_SERVER_URL}/api/v1/repos/${{ github.repository }}/releases"
          TAG="${{ github.ref_name }}"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          FILENAME="ambulanza-turni-${TAG}.apk"

          curl -fsS -X DELETE --user "${{ github.actor }}:${REGISTRY_TOKEN}" \
            "$API/tags/$TAG" || true

          RELEASE_JSON=$(curl -fsS -X POST --user "${{ github.actor }}:${REGISTRY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"Build automatica da $GITHUB_SHA.\",\"draft\":false,\"prerelease\":false}" \
            "$API")
          RELEASE_ID=$(echo "$RELEASE_JSON" | grep -oP '"id":\K[0-9]+' | head -n1)

          curl -fsS -X POST --user "${{ github.actor }}:${REGISTRY_TOKEN}" \
            -F "attachment=@${APK};filename=${FILENAME}" \
            "$API/$RELEASE_ID/assets?name=${FILENAME}"
          echo "Release $TAG pubblicata con asset $FILENAME"
