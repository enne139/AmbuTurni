# Workflow Gitea: compila l'APK Android con Flutter.
#
# Trigger: manuale (workflow_dispatch) o push di tag vX.Y.Z.
#
# Requisiti runner: label `android`, Linux x86_64, wget/unzip/curl,
# JDK 23 preinstallato o scaricabile, accesso a Internet, >= 8 GB RAM.
#
# Output: APK caricato come artifact della run. Sui push di tag, l'APK viene
# ANCHE pubblicato come Release su Gitea (allegato al tag), con l'action
# akkuman/gitea-release-action (dedicata a Gitea, non l'action GitHub ufficiale
# che non esiste per questo scopo). Serve il secret REGISTRY_TOKEN (PAT con
# scope write:repository, oltre a write:package già richiesto per il backend).

name: build-android-apk

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '23'

jobs:
  build:
    runs-on: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Installa Android SDK
        run: |
          SDK=$HOME/android-sdk
          TOOLS=$SDK/cmdline-tools/latest/bin
          mkdir -p $SDK/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
               -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d $SDK/cmdline-tools
          mv $SDK/cmdline-tools/cmdline-tools $SDK/cmdline-tools/latest
          yes | $TOOLS/sdkmanager --licenses > /dev/null 2>&1 || true
          $TOOLS/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK"     >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "$TOOLS"                >> $GITHUB_PATH
          echo "$SDK/platform-tools"   >> $GITHUB_PATH

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Installa dipendenze Dart
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release

      - name: Pubblica APK come artifact
        uses: actions/upload-artifact@v3
        with:
          name: ambulanza-turni-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Pubblica la Release su Gitea (solo su push di tag)
        # continue-on-error: un fallimento qui (es. token senza scope corretto) non
        # deve far fallire il job: l'APK e l'artifact sono già stati pubblicati allo
        # step precedente. In caso di errore, il log stampato dall'action stessa
        # riporta la risposta HTTP di Gitea (utile per distinguere token mancante
        # da scope sbagliato: verifica write:repository su REGISTRY_TOKEN).
        if: github.ref_type == 'tag'
        continue-on-error: true
        uses: akkuman/gitea-release-action@v1
        env:
          NODE_OPTIONS: '--experimental-fetch'
        with:
          server_url: ${{ github.server_url }}
          repository: ${{ github.repository }}
          token: ${{ secrets.REGISTRY_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: "Build automatica da ${{ github.sha }}."
          files: |-
            build/app/outputs/flutter-apk/app-release.apk
