name: build-backend-image

on:
  push:
    branches: [main, sviluppo]
    paths:
      - 'backend/**'
      - '.gitea/workflows/build-backend.yml'
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Configura il servizio Docker-in-Docker
    services:
      docker:
        image: docker:dind
        # Fornisce i privilegi necessari al container DinD per avviare il demone Docker
        options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & push sullo stesso Gitea (Docker DinD)
        env:
          # Variabile cruciale per dire al client Docker dove trovare il demone DinD
          DOCKER_HOST: tcp://docker:2375
          DOCKER_TLS_CERTDIR: "" # Disabilita TLS se non configurato (comune in ambienti locali/interni)
          
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          # Attendi un istante che il demone Docker sia effettivamente pronto
          until docker info >/dev/null 2>&1; do
            echo "In attesa del demone Docker..."
            sleep 1
          done

          # Ricava host e owner (in minuscolo: il registry OCI richiede lowercase).
          HOST="${SERVER_URL#http://}"; HOST="${HOST#https://}"; HOST="${HOST%%/*}"
          OWNER_LC="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          IMG="$HOST/$OWNER_LC/ambulanza-sync"
          TAG="${GITHUB_SHA::8}"

          # Usa il PAT se fornito, altrimenti il token automatico.
          TOKEN="${REGISTRY_TOKEN:-$GITEA_TOKEN}"

          echo "Costruisco e pubblico $IMG:$TAG su $HOST"
          docker build -t "$IMG:$TAG" -t "$IMG:latest" ./backend
          printf '%s' "$TOKEN" | docker login "$HOST" -u "$ACTOR" --password-stdin
          docker push "$IMG:$TAG"
          docker push "$IMG:latest"
          echo "Pubblicata: $IMG:$TAG  (e :latest)"