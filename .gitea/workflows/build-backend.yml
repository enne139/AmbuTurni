# Action Gitea: costruisce e pubblica l'immagine del backend con Docker,
# sul Container Registry della STESSA istanza Gitea.
#
# L'host del registry si ricava da GITHUB_SERVER_URL (niente secret per l'host).
# Per l'autenticazione serve UN solo secret: REGISTRY_TOKEN = un PAT Gitea con
# scope write:package (Settings -> Applications -> Generate New Token). Il token
# integrato GITHUB_TOKEN NON basta: non ha i permessi sui package (-> unauthorized).
#
# Richiede un runner con accesso al daemon Docker (socket /var/run/docker.sock
# montato, oppure Docker-in-Docker).

name: build-backend-image

# Trigger SOLO su modifiche al backend: il filtro paths limita le push su main,
# e il trigger sui tag e' stato rimosso perche' i tag vX.Y.Z sono release
# dell'APP Flutter — facevano ricostruire l'immagine backend a ogni release
# APK anche senza alcuna modifica al backend (l'immagine e' taggata con
# SHA+latest, non con la versione: il tag trigger non aggiungeva nulla).
# Per una build manuale resta workflow_dispatch.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.gitea/workflows/build-backend.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepara variabili registry
        # Host del registry = host di questa istanza Gitea, senza schema http/https.
        # Owner in minuscolo perché i nomi immagine Docker devono essere lowercase.
        run: |
          REGISTRY="${GITHUB_SERVER_URL#http://}"
          REGISTRY="${REGISTRY#https://}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
          echo "IMAGE=$REGISTRY/$OWNER/ambulanza-sync" >> "$GITHUB_ENV"

      - name: Login al registry
        # PAT via stdin: utente = chi ha lanciato il workflow (proprietario del token).
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login -u "${{ github.actor }}" --password-stdin "$REGISTRY"

      - name: Build dell'immagine
        # Builder "default" (driver docker) + --load: l'immagine entra nello store locale
        # del daemon. Il builder docker-container, oltre a non caricare in locale, gira in
        # un container con rete isolata che qui NON raggiunge il registry (il push da li'
        # da' "connection refused", mentre il login dal job funziona).
        # Contesto ./backend (dove sta il Dockerfile). Tag = SHA del commit + latest.
        run: docker buildx build --builder default --load -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" ./backend

      - name: Push dell'immagine
        # Push dal job container, che raggiunge il registry (stesso contesto del login OK).
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
