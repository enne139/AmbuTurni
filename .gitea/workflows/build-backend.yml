name: build-backend-image

on:
  push:
    branches: [main, sviluppo]
    paths:
      - 'backend/**'
      - '.gitea/workflows/build-backend.yml'
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Forza il job a girare dentro un container con Podman già pronto
    container:
      image: quay.io/podman/stable:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & push sullo stesso Gitea (Podman)
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          # Ricava host e owner
          HOST="${SERVER_URL#http://}"; HOST="${HOST#https://}"; HOST="${HOST%%/*}"
          OWNER_LC="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          IMG="$HOST/$OWNER_LC/ambulanza-sync"
          TAG="${GITHUB_SHA::8}"

          TOKEN="${REGISTRY_TOKEN:-$GITEA_TOKEN}"

          echo "Costruisco e pubblico $IMG:$TAG su $HOST"
          
          # Podman non ha bisogno di demoni o privilegiati di root
          podman build -t "$IMG:$TAG" -t "$IMG:latest" ./backend
          printf '%s' "$TOKEN" | podman login "$HOST" -u "$ACTOR" --password-stdin
          podman push "$IMG:$TAG"
          podman push "$IMG:latest"
          
          echo "Pubblicata: $IMG:$TAG  (e :latest)"