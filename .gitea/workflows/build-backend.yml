# Action Gitea: costruisce e pubblica l'immagine del backend con Docker,
# sul Container Registry dello stesso Gitea.
#
# Richiede un runner con accesso al daemon Docker (socket /var/run/docker.sock
# montato, oppure Docker-in-Docker).
#
# Secrets richiesti (Settings → Actions → Secrets):
#   REGISTRY_HOST      host del registry, es: gitea.maratuck.com
#   REGISTRY_USER      utente Gitea con scrittura sui package
#   REGISTRY_PASSWORD  password o token (PAT con scope write:package)

name: build-backend-image

on:
  push:
    branches: [main, sviluppo]
    paths:
      - 'backend/**'
      - '.gitea/workflows/build-backend.yml'
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Percorso completo dell'immagine: <host>/<owner>/ambulanza-sync
      IMAGE: ${{ secrets.REGISTRY_HOST }}/${{ github.repository_owner }}/ambulanza-sync

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login al registry
        # Password via stdin per non lasciarla nei log/processi.
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.REGISTRY_USER }}" --password-stdin "${{ secrets.REGISTRY_HOST }}"

      - name: Build dell'immagine
        # Contesto ./backend (dove sta il Dockerfile). Tag = SHA del commit + latest.
        run: docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" ./backend

      - name: Push dell'immagine
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
