# Action Gitea: costruisce e pubblica l'immagine del backend sul REGISTRY DELLO
# STESSO GITEA (Packages → Container), usando il token automatico dell'action.
#
# Prerequisiti:
#  - il runner deve avere `podman` disponibile e `runs-on` deve combaciare con
#    un'etichetta del tuo runner (qui: ubuntu-latest);
#  - nel Gitea deve essere abilitato il Container Registry (lo è di default);
#  - l'utente che fa partire l'action (github.actor) deve poter scrivere i package
#    del proprio owner. Se il token automatico non bastasse, crea un secret
#    REGISTRY_TOKEN (PAT con scope write:package) e verrà usato al suo posto.
#
# Immagine prodotta: <host-gitea>/<owner>/ambulanza-sync:<sha> e :latest

name: build-backend-image

on:
  push:
    branches: [main, sviluppo]
    paths:
      - 'backend/**'
      - '.gitea/workflows/build-backend.yml'
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & push sullo stesso Gitea (Podman)
        env:
          # Token automatico dell'action; REGISTRY_TOKEN (PAT) usato come fallback se presente.
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          # Ricava host e owner (in minuscolo: il registry OCI richiede lowercase).
          HOST="${SERVER_URL#http://}"; HOST="${HOST#https://}"; HOST="${HOST%%/*}"
          OWNER_LC="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          IMG="$HOST/$OWNER_LC/ambulanza-sync"
          TAG="${GITHUB_SHA::8}"

          # Usa il PAT se fornito, altrimenti il token automatico.
          TOKEN="${REGISTRY_TOKEN:-$GITEA_TOKEN}"

          echo "Costruisco e pubblico $IMG:$TAG su $HOST"
          podman build -t "$IMG:$TAG" -t "$IMG:latest" ./backend
          printf '%s' "$TOKEN" | podman login "$HOST" -u "$ACTOR" --password-stdin
          podman push "$IMG:$TAG"
          podman push "$IMG:latest"
          echo "Pubblicata: $IMG:$TAG  (e :latest)"
