name: build-backend-image

on:
  push:
    branches: [main, sviluppo]
    paths:
      - 'backend/**'
      - '.gitea/workflows/build-backend.yml'
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    # Esegui sul runner self-hosted che ha podman installato
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & push sullo stesso Gitea (Podman)
        env:
          # Imposta questi secrets nel repo / org:
          # REGISTRY_HOST es: gitea.example.com:3000
          # REGISTRY_TOKEN token per push
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          HOST="${REGISTRY_HOST}"
          OWNER_LC="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          IMG="$HOST/$OWNER_LC/ambulanza-sync"
          TAG="${GITHUB_SHA::8}"

          TOKEN="${REGISTRY_TOKEN}"

          echo "Costruisco e pubblico $IMG:$TAG su $HOST"

          # Esegui build e push con podman disponibile sul runner
          podman build -t "$IMG:$TAG" -t "$IMG:latest" ./backend

          # Se il registry usa cert self-signed e sei in test, puoi aggiungere --tls-verify=false
          printf '%s' "$TOKEN" | podman login "$HOST" -u "$ACTOR" --password-stdin
          podman push "$IMG:$TAG"
          podman push "$IMG:latest"

          echo "Pubblicata: $IMG:$TAG  (e :latest)"