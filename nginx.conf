# Config nginx per la versione web: SPA Flutter, un'unica pagina index.html
# che gestisce la navigazione lato client (fallback su ogni path), più il
# reverse proxy verso il backend Go (backend/, avviato nello stesso
# container da docker-entrypoint.sh) sotto /api/ e /admin/.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend ospedali: pass-through di /api/xxx così com'è (proxy_pass senza
    # path finale = nginx inoltra l'URI originale invariato). Le rotte Go
    # vivono sotto /api/ anche quando il backend gira da solo, senza nginx
    # davanti (sviluppo locale, backend/docker-compose.yml): se qui si
    # togliesse il prefisso, il client (che chiama sempre $baseUrl/api/...,
    # vedi utils/backend_api.dart) funzionerebbe solo in produzione e mai in
    # locale, indipendentemente dall'indirizzo configurato nell'app — bug
    # reale scoperto testando il backend standalone.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pagina admin del backend (gestione ospedali): percorso diretto, non
    # sotto /api/, per un URL più corto da comunicare a chi la usa.
    location /admin/ {
        proxy_pass http://127.0.0.1:3000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # File versionati per hash da Flutter (main.dart.js, assets/*): cache
    # lunga sicura, un cambio di contenuto cambia il nome del file.
    location ~* \.(?:js|css|wasm|png|jpg|jpeg|gif|ico|svg|ttf|otf|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html invece va rivalidato a ogni deploy: e' lui che referenzia
    # gli asset con hash aggiornato.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
